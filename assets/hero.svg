<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Prashil Gajbhiye — First-year CSE, open-source contributor">
  <defs>
    <linearGradient id="phBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0507"/>
      <stop offset="50%" stop-color="#1A0A10"/>
      <stop offset="100%" stop-color="#0A0507"/>
    </linearGradient>
    <radialGradient id="phGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#DC143C" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#DC143C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="phName" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#FFE9A3"/>
      <stop offset="100%" stop-color="#FFD700"/>
      <animate attributeName="x1" values="0;1;0" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="14s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="phRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DC143C"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#DC143C"/>
    </linearGradient>
    <pattern id="phGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFD700" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="phBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="phSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="340" fill="url(#phBg)"/>
  <rect width="1200" height="340" fill="url(#phGrid)"/>

  <!-- glow field -->
  <ellipse cx="980" cy="120" rx="330" ry="260" fill="url(#phGlow)"/>

  <!-- orbital arcs -->
  <g fill="none" stroke="#FFD700" stroke-opacity="0.22">
    <circle cx="980" cy="120" r="120" stroke-width="1"/>
    <circle cx="980" cy="120" r="170" stroke-width="1" stroke-dasharray="3 9"/>
    <circle cx="980" cy="120" r="220" stroke-width="1" stroke-opacity="0.10"/>
  </g>

  <!-- straw hat silhouette -->
  <g transform="translate(905,55) scale(1.05)" opacity="0.9">
    <ellipse cx="72" cy="88" rx="88" ry="16" fill="#FFD700" fill-opacity="0.16"/>
    <path d="M-8 88 Q72 64 152 88 Q72 106 -8 88 Z" fill="#FFD700" fill-opacity="0.30"/>
    <path d="M18 88 Q22 34 72 30 Q122 34 126 88 Q72 74 18 88 Z" fill="#DC143C" fill-opacity="0.35"/>
    <path d="M18 88 Q22 34 72 30 Q122 34 126 88" fill="none" stroke="#FFD700" stroke-opacity="0.7" stroke-width="2.5"/>
    <path d="M20 70 Q72 62 124 70" fill="none" stroke="#DC143C" stroke-width="7" stroke-opacity="0.85"/>
  </g>

  <!-- name -->
  <text x="76" y="150" fill="url(#phName)" font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="76" font-weight="800" letter-spacing="-2">Prashil Gajbhiye</text>

  <!-- role -->
  <text x="80" y="198" fill="#FFD700" font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="21" font-weight="600" letter-spacing="0.6">
    First-year CSE · Open-source contributor · Builder
  </text>

  <!-- stack line -->
  <text x="80" y="232" fill="#B9B9B9" font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="15" letter-spacing="0.3">
    C++ · JavaScript · Python · Go &nbsp; | &nbsp; meshery/meshery · layer5io/layer5
  </text>

  <!-- rule -->
  <rect x="80" y="260" width="260" height="4" rx="2" fill="url(#phRule)" filter="url(#phSoft)">
    <animate attributeName="width" values="180;300;180" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- corner marks -->
  <g stroke="#FFD700" stroke-opacity="0.5" stroke-width="2" fill="none">
    <path d="M40 40 h28 M40 40 v28"/>
    <path d="M1160 40 h-28 M1160 40 v28"/>
    <path d="M40 300 h28 M40 300 v-28"/>
    <path d="M1160 300 h-28 M1160 300 v-28"/>
  </g>
</svg>
